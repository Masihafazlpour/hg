<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامان | Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e6eaf0;--primary:#3267e3;--primary2:#214db2;--success:#17834b;--danger:#c73b3b;--shadow:0 10px 28px rgba(24,39,75,.08);--radius:18px}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:20;padding:14px 14px 10px;background:rgba(244,247,251,.92);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#3d75ef,#244fbc);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}.brand-title{font-weight:900}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}.content{padding:8px 14px}.hero{background:linear-gradient(135deg,#2f63dd,#6c8ff0);color:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 34px rgba(50,103,227,.23)}.hero h2{margin:0 0 7px;font-size:18px}.hero p{margin:0;opacity:.92;line-height:1.9;font-size:13px}.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}.section-title{font-weight:900;margin:0 0 10px}.student-grid{display:grid;gap:9px}.student{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--border);border-radius:14px;background:#fff;text-align:right}.avatar{width:38px;height:38px;border-radius:12px;background:#eef3ff;color:var(--primary);display:grid;place-items:center;font-weight:900}.student-meta{min-width:0;flex:1}.student-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:12px;color:var(--muted);margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{padding:14px;border:1px solid var(--border);border-radius:15px;background:#fff;text-align:right}.quick strong{display:block;margin-top:5px}.conversation{display:flex;gap:10px;padding:12px;border:1px solid var(--border);border-radius:15px;background:#fff;margin-bottom:8px}.conversation-main{flex:1;min-width:0}.conversation-title{font-weight:900}.conversation-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.conversation-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#eef2f7;color:#455164}.badge.new{background:#e6f0ff;color:#245b91}.badge.green{background:#e4f8ed;color:#147145}.badge.orange{background:#fff1d8;color:#95620e}.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:120px}.bubble{max-width:86%;padding:11px 12px;border-radius:16px;line-height:1.9;box-shadow:0 4px 14px rgba(25,39,75,.05);border:1px solid var(--border);white-space:pre-wrap}.bubble.family{align-self:flex-start;background:#fff;border-bottom-right-radius:5px}.bubble.admin{align-self:flex-end;background:#e9f1ff;border-color:#d6e3ff;border-bottom-left-radius:5px}.bubble.system{align-self:center;background:#f6f7f9;color:#5a6472}.bubble-time{font-size:10px;color:var(--muted);margin-top:5px}.day-sep{text-align:center;color:var(--muted);font-size:11px;margin:7px 0}.composer{position:fixed;bottom:58px;right:0;left:0;z-index:30;padding:10px 12px;background:rgba(244,247,251,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border)}.composer-row{display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:46px;max-height:140px;resize:vertical;border:1px solid var(--border);border-radius:15px;padding:11px 12px;outline:none;background:#fff}.send{width:48px;height:46px;border-radius:15px;background:var(--primary);color:#fff;font-weight:900}.bottom{position:fixed;bottom:0;right:0;left:0;z-index:40;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:max(7px,env(safe-area-inset-bottom)) 8px 7px}.nav{padding:7px 4px;color:var(--muted);background:transparent;border-radius:12px;font-size:11px}.nav.active{color:var(--primary);background:#eef3ff;font-weight:900}.view{display:none}.view.active{display:block}.empty{padding:28px 10px;color:var(--muted);text-align:center}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.back{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 11px}.field{margin-top:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:13px;padding:11px;background:#fff;outline:none}.primary{width:100%;margin-top:10px;background:var(--primary);color:#fff;border-radius:13px;padding:11px;font-weight:900}.danger{background:#fff1f1;color:var(--danger);border:1px solid #ffd7d7;border-radius:12px;padding:9px 12px}.notice{padding:12px;border:1px solid var(--border);border-radius:15px;background:#fff;margin-bottom:9px}.notice.unread{border-color:#bfd1ff;background:#fbfdff}.loading{padding:35px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;left:14px;right:14px;bottom:118px;z-index:60;background:#172033;color:#fff;border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.link-row{display:flex;gap:8px}.link-row input{flex:1}.status-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success)}@media(min-width:700px){.app{max-width:760px;margin:auto}.composer,.bottom{max-width:760px;margin:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-logo">س</div><div><div class="brand-title">سامان</div><div class="brand-sub">ارتباط یکپارچه با مدرسه</div></div></div>
  </header>
  <main class="content">
    <section id="homeView" class="view active"></section>
    <section id="chatsView" class="view"></section>
    <section id="attendanceView" class="view"></section>
    <section id="notificationsView" class="view"></section>
    <section id="chatView" class="view"></section>
    <section id="linkView" class="view"></section>
  </main>
  <div id="composer" class="composer" style="display:none"><div class="composer-row"><textarea id="messageInput" placeholder="پیام خود را برای مدیر بنویسید..."></textarea><button id="sendBtn" class="send">➤</button></div></div>
  <nav class="bottom">
    <button class="nav active" data-nav="home">خانه</button>
    <button class="nav" data-nav="chats">گفتگوها</button>
    <button class="nav" data-nav="attendance">حضور</button>
    <button class="nav" data-nav="notifications">اعلان‌ها</button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
'use strict';
const tg=window.Telegram?.WebApp;
const EDGE_URL='https://njinbgaatbnpuulnmoui.supabase.co/functions/v1/family-telegram';
const state={account:null,students:[],conversations:[],notifications:[],activeStudentId:null,activeConversation:null,messages:[],view:'home'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escAttr=v=>esc(v).replace(/\n/g,' ');
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function dateLabel(v,withTime=false){const d=new Date(v);if(Number.isNaN(d.getTime()))return v;const date=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tehran'}).format(d);if(!withTime)return date;return `${date} — ${new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tehran'}).format(d)}`}
function statusLabel(s){return ({open:'باز',waiting_admin:'در انتظار مدیر',waiting_family:'در انتظار خانواده',resolved:'پایان‌یافته',closed:'بسته'}[s]||s)}
function mdToHtml(v){let x=esc(v);x=x.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<b>$1</b>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>').replace(/\|\|([^|\n]+)\|\|/g,'<span style="background:#374151;color:#374151;border-radius:5px;padding:0 4px">$1</span>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>').replace(/_([^_\n]+)_/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');return x}
async function api(action,extra={}){const initData=tg?.initData||'';const res=await fetch(EDGE_URL,{method:'POST',headers:{'content-type':'application/json','x-saman-mini-app':'1'},body:JSON.stringify({action,init_data:initData,...extra})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.ok)throw new Error(data.message||'خطا در ارتباط با سامانه');return data}
function showView(name){if(name!=='chat'&&state.pollTimer){clearInterval(state.pollTimer);state.pollTimer=null}document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(name+'View')?.classList.add('active');state.view=name;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.nav===name));$('composer').style.display=name==='chatView'||name==='chat'?'block':'none'}
function studentCard(s){return `<div class="student" data-student="${escAttr(s.id)}"><div class="avatar">${esc((s.first_name||'').slice(0,1))}</div><div class="student-meta"><div class="student-name">${esc(`${s.first_name||''} ${s.last_name||''}`.trim())}</div><div class="small">${esc(s.grade||'')} ${s.major?` • ${esc(s.major)}`:''}</div></div><div>›</div></div>`}
function renderHome(){
  const name=state.account?.first_name||'کاربر';const unread=state.notifications.filter(n=>!n.read_at).length;const support=state.students[0]?
    `<div class="grid2"><button class="quick" id="newChatBtn">💬<strong>چت با مدیر</strong><div class="small">گفتگوی مستقیم</div></button><button class="quick" id="linkBtn">🔗<strong>اتصال دانش‌آموز</strong><div class="small">حداکثر ۳ دانش‌آموز</div></button></div>`:'';
  $('homeView').innerHTML=`<div class="hero"><h2>سلام ${esc(name)} 👋</h2><p>اینجا پیام‌های مدرسه، درخواست‌ها و گفت‌وگو با مدیر را در یکجا می‌بینید.</p></div><div class="panel"><div class="section-title">فرزندان من</div><div class="student-grid">${state.students.length?state.students.map(studentCard).join(''):'<div class="empty">هنوز دانش‌آموزی متصل نشده است.</div>'}</div></div><div class="panel">${support}</div><div class="panel"><div class="toolbar"><div class="section-title" style="margin:0">وضعیت</div><div class="status-line"><span class="status-dot"></span><span class="small">اتصال Telegram فعال</span></div></div><div class="small">${unread?`${unread} پیام/اطلاعیه خوانده‌نشده دارید.`:'پیام خوانده‌نشده‌ای ندارید.'}</div></div>`;
  document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>openStudent(b.dataset.student));$('newChatBtn')?.addEventListener('click',()=>startChat());$('linkBtn')?.addEventListener('click',()=>showLink());
}
function renderChats(){
  const list=state.conversations;
  $('chatsView').innerHTML=`<div class="panel"><div class="toolbar"><div class="section-title" style="margin:0">گفتگوها</div><button class="back" id="chatNewBtn">+ گفتگوی جدید</button></div>${list.length?list.map(c=>{const s=state.students.find(x=>String(x.id)===String(c.student_id));return `<button class="conversation" data-conv="${escAttr(c.id)}"><div class="avatar">${esc((s?.first_name||'').slice(0,1))}</div><div class="conversation-main"><div class="conversation-title">${esc(c.subject||'گفتگو با مدیر')}</div><div class="small">${esc(`${s?.first_name||''} ${s?.last_name||''}`.trim())}</div><div class="conversation-preview">${esc(c.last_message?.body||'')}</div></div><div class="conversation-right"><div class="small">${dateLabel(c.last_message_at,true)}</div><span class="badge ${c.status==='waiting_admin'?'new':c.status==='waiting_family'?'orange':c.status==='resolved'?'green':''}">${esc(statusLabel(c.status))}</span></div></button>`}).join(''):'<div class="empty">گفتگویی ندارید.</div>'}</div>`;
  document.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>openConversation(b.dataset.conv));$('chatNewBtn').onclick=()=>startChat();
}
function renderAttendance(){
  $('attendanceView').innerHTML=`<div class="panel"><div class="section-title">حضور و غیاب</div>${state.students.length?state.students.map(s=>`<button class="student" data-att="${escAttr(s.id)}"><div class="avatar">${esc((s.first_name||'').slice(0,1))}</div><div class="student-meta"><div class="student-name">${esc(`${s.first_name||''} ${s.last_name||''}`.trim())}</div><div class="small">مشاهده سوابق</div></div><div>›</div></button>`).join(''):'<div class="empty">دانش‌آموزی متصل نیست.</div>'}</div><div id="attDetail"></div>`;
  document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>loadAttendance(b.dataset.att));
}
async function loadAttendance(studentId){const s=state.students.find(x=>String(x.id)===String(studentId));try{const d=await api('attendance',{student_id:studentId});$('attDetail').innerHTML=`<div class="panel"><div class="toolbar"><div class="section-title" style="margin:0">${esc(`${s?.first_name||''} ${s?.last_name||''}`.trim())}</div></div>${d.records.length?d.records.map(r=>`<div class="notice"><b>${esc(dateLabel(r.date))}</b><div class="small">${esc(r.scope_type==='full_day'?'کل روز':`زنگ ${r.bell_number||''}`)} — ${esc(r.status==='absent'?'غیبت غیرموجه':r.status==='late_unexcused'?'تأخیر غیرموجه':r.status==='excused'?'غیبت موجه':r.status==='late_excused'?'تأخیر موجه':r.status)}</div>${r.note?`<div class="small">${esc(r.note)}</div>`:''}</div>`).join(''):'<div class="empty">رکوردی برای نمایش نیست.</div>'}</div>`}catch(e){toast(e.message)}}
function renderNotifications(){
  $('notificationsView').innerHTML=`<div class="panel"><div class="section-title">پیام‌های مدرسه</div>${state.notifications.length?state.notifications.map(n=>`<div class="notice ${n.read_at?'':'unread'}"><div class="small">${dateLabel(n.created_at,true)}</div><div style="margin-top:7px;line-height:1.9">${mdToHtml(n.rendered_body)}</div>${!n.read_at?`<button class="back" style="margin-top:9px" data-notice="${escAttr(n.id)}">✓ خواندم</button>`:''}</div>`).join(''):'<div class="empty">پیامی ندارید.</div>'}</div>`;
  document.querySelectorAll('[data-notice]').forEach(b=>b.onclick=async()=>{try{await api('mark_notification_read',{id:b.dataset.notice});const n=state.notifications.find(x=>String(x.id)===String(b.dataset.notice));if(n)n.read_at=new Date().toISOString();renderNotifications()}catch(e){toast(e.message)}})
}
function renderChat(silent=false){
  const c=state.activeConversation,m=state.messages;const s=state.students.find(x=>String(x.id)===String(c?.student_id));
  let lastDay='';let html=`<div class="panel"><div class="toolbar"><div><div class="section-title" style="margin:0">${esc(c?.subject||'گفتگو با مدیر')}</div><div class="small">${esc(`${s?.first_name||''} ${s?.last_name||''}`.trim())} — ${esc(statusLabel(c?.status||''))}</div></div><button class="back" id="backChats">←</button></div><div class="chat">`;
  for(const msg of m){const day=dateLabel(msg.created_at);if(day!==lastDay){html+=`<div class="day-sep">${esc(day)}</div>`;lastDay=day}html+=`<div class="bubble ${msg.sender_type==='admin'?'admin':msg.sender_type==='system'?'system':'family'}"><div>${mdToHtml(msg.body)}</div><div class="bubble-time">${esc(dateLabel(msg.created_at,true))} · ${esc(msg.channel==='telegram'||msg.channel==='mini_app'?'Telegram':msg.channel==='bale'?'بله':'سامان')}</div></div>`}
  html+='</div></div>';const sc=$('chatView')?.querySelector('.chat');const stick=Boolean(sc&&Math.abs(sc.scrollHeight-sc.scrollTop-sc.clientHeight)<80);$('chatView').innerHTML=html;$('backChats').onclick=()=>{showView('chats');renderChats()};const fresh=$('chatView')?.querySelector('.chat');if(fresh&&(stick||silent))fresh.scrollTop=fresh.scrollHeight;
}
function showLink(){showView('link');$('linkView').innerHTML=`<div class="panel"><div class="toolbar"><div class="section-title" style="margin:0">اتصال دانش‌آموز</div><button class="back" id="cancelLink">←</button></div><div class="small">کد ملی دانش‌آموز را وارد کنید. هر حساب حداکثر ۳ دانش‌آموز و هر دانش‌آموز حداکثر ۳ حساب Telegram می‌تواند داشته باشد.</div><div class="field"><label>کد ملی</label><input id="nationalInput" inputmode="numeric" maxlength="10" placeholder="مثلاً ۰۰۱۲۳۴۵۶۷۸"></div><button class="primary" id="saveLink">اتصال دانش‌آموز</button></div>`;$('cancelLink').onclick=()=>{showView('home');renderHome()};$('saveLink').onclick=async()=>{try{const n=$('nationalInput').value.trim();const r=await api('link_student',{national_code:n});state.students.push(r.student);toast('دانش‌آموز با موفقیت متصل شد.');showView('home');renderHome()}catch(e){toast(e.message)}}}
async function startChat(){if(!state.students.length){showLink();return}const sid=state.activeStudentId||String(state.students[0].id);try{const r=await api('start_support',{student_id:sid});if(r.id){await openConversation(String(r.id))}else{await refresh();const found=state.conversations.find(c=>c.kind==='support'&&String(c.student_id)===sid);if(found)openConversation(found.id)}}catch(e){toast(e.message)}}
function openStudent(id){state.activeStudentId=String(id);showView('chats');renderChats()}
async function openConversation(id){
  try{
    const r=await api('messages',{conversation_id:id});
    state.activeConversation=r.conversation;state.messages=r.messages;showView('chat');renderChat();
    if(state.pollTimer)clearInterval(state.pollTimer);
    state.pollTimer=setInterval(async()=>{
      if(!state.activeConversation||state.view!=='chat')return;
      try{const d=await api('messages',{conversation_id:state.activeConversation.id});state.activeConversation=d.conversation;state.messages=d.messages;renderChat(true);}catch(_){}
    },2500);
  }catch(e){toast(e.message)}
}
async function refresh(){const d=await api('bootstrap');state.account=d.account;state.students=d.students||[];state.conversations=d.conversations||[];state.notifications=d.notifications||[]}
$('sendBtn').onclick=async()=>{const input=$('messageInput');const body=input.value.trim();if(!body||!state.activeConversation)return;try{await api('send_message',{conversation_id:state.activeConversation.id,body});input.value='';const r=await api('messages',{conversation_id:state.activeConversation.id});state.activeConversation=r.conversation;state.messages=r.messages;renderChat()}catch(e){toast(e.message)}};
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('sendBtn').click()}});
document.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>{const v=n.dataset.nav;showView(v);if(v==='home')renderHome();if(v==='chats')renderChats();if(v==='attendance')renderAttendance();if(v==='notifications')renderNotifications()});
async function boot(){if(tg){tg.ready();tg.expand();}try{await refresh();renderHome()}catch(e){$('homeView').innerHTML=`<div class="panel"><div class="empty">${esc(e.message||'خطا در راه‌اندازی Mini App')}</div></div>`}}
boot();
})();
</script>
</body>
</html>

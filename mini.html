<style>
:root{

  --primary:#2b6ef3;--primary-2:#6558f5;--accent:#14b8a6;--orange:#f59e0b;--red:#ef476f;--green:#22a06b;

}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,IRANSans,Segoe UI,Tahoma,Arial,sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(99,102,241,.14),transparent 34%),
radial-gradient(circle at 100% 0%,rgba(20,184,166,.13),transparent 30%),var(--bg);color:var(--ink)}
body{padding:14px 12px 100px}.app{max-width:520px;margin:auto}.hidden{display:none!important}
.top{padding:10px 4px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,#2b6ef3,#6558f5);display:grid;place-items:center;color:white;font-size:22px;font-weight:900;box-shadow:0 12px 25px rgba(43,110,243,.28)}.brand h1{font-size:1.12rem;margin:0;font-weight:900}.brand p{margin:3px 0 0;color:var(--muted);font-size:.76rem}.mini-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.75);color:var(--ink);font-size:18px}
.hero{background:linear-gradient(135deg,#081a33 0%,#24498f 52%,#7868f5 100%);color:white;border-radius:30px;padding:23px 20px;box-shadow:0 22px 60px rgba(24,43,95,.25);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border:26px solid rgba(255,255,255,.07);border-radius:50%;left:-50px;top:-70px}.hero .eyebrow{font-size:.73rem;opacity:.76}.hero h2{font-size:1.48rem;line-height:1.5;margin:7px 0 5px;max-width:85%}.hero p{margin:0;color:rgba(255,255,255,.82);font-size:.79rem;line-height:1.8}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:10px}.role-chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:.7rem}.online{width:10px;height:10px;border-radius:50%;background:#35d58b;display:inline-block;margin-left:5px;box-shadow:0 0 0 5px rgba(53,213,139,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat{background:var(--surface);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);border-radius:20px;padding:13px 10px}.stat .n{font-size:1.15rem;font-weight:900}.stat .l{font-size:.69rem;color:var(--muted);margin-top:4px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}.section-head h3{margin:0;font-size:.98rem}.link{border:0;background:transparent;color:var(--primary);font-size:.73rem;font-weight:800}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);border-radius:22px;padding:14px;margin-bottom:9px}.conversation{display:flex;align-items:center;gap:11px}.avatar{width:45px;height:45px;border-radius:16px;background:linear-gradient(135deg,#e9efff,#e0e7ff);color:#3452ba;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.avatar.staff{background:linear-gradient(135deg,#dbf8f2,#d5f3eb);color:#067c6f}.avatar.warn{background:linear-gradient(135deg,#fff2cf,#ffe7ad);color:#a66b00}.grow{flex:1;min-width:0}.title-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.title-line strong{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:.62rem;color:var(--muted);white-space:nowrap}.preview{margin-top:4px;font-size:.71rem;color:var(--muted);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:.62rem;display:grid;place-items:center;font-weight:900}
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.contact{border:0;text-align:right;padding:13px;border-radius:19px;background:linear-gradient(145deg,#fff,#f7f9fc);box-shadow:0 10px 35px rgba(20,35,65,.07);border:1px solid var(--line);cursor:pointer}.contact .ci{width:37px;height:37px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:18px;margin-bottom:10px}.contact strong{display:block;font-size:.8rem}.contact span{display:block;font-size:.66rem;color:var(--muted);margin-top:3px}
.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(500px,calc(100% - 20px));background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 50px rgba(30,42,72,.18);padding:8px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:20}.nav{border:0;background:transparent;border-radius:16px;padding:8px 5px;color:var(--muted);font-size:.62rem;cursor:pointer}.nav .ico{font-size:17px;display:block;margin-bottom:3px}.nav.active{background:linear-gradient(135deg,rgba(43,110,243,.12),rgba(101,88,245,.12));color:var(--primary);font-weight:900}
.chat{display:flex;flex-direction:column;gap:9px;min-height:55vh}.bubble{max-width:86%;position:relative;padding:12px 14px;border-radius:19px;line-height:1.85;font-size:.77rem;box-shadow:0 8px 24px rgba(25,40,70,.06);white-space:pre-wrap;word-break:break-word}.bubble.family{align-self:flex-start;background:#edf3ff;border-bottom-left-radius:8px}.bubble.staff{align-self:flex-end;background:linear-gradient(135deg,#2b6ef3,#6558f5);color:#fff;border-bottom-right-radius:8px}.bubble .meta{font-size:.58rem;opacity:.65;margin-top:5px}.composer{position:sticky;bottom:88px;display:flex;gap:8px;margin-top:12px;background:rgba(244,247,251,.86);backdrop-filter:blur(10px);padding:8px 0}.day-sep{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--muted);font-size:.62rem}.day-sep:before,.day-sep:after{content:'';height:1px;background:var(--line);flex:1}.day-sep span{background:rgba(255,255,255,.7);padding:5px 9px;border-radius:999px}.composer textarea{flex:1;min-height:49px;max-height:120px;border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;resize:none;outline:none}.send{width:50px;height:50px;border:0;border-radius:17px;background:linear-gradient(135deg,#2b6ef3,#6558f5);color:#fff;font-size:18px}
.sheet{position:fixed;inset:0;background:rgba(10,18,35,.45);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet-card{width:min(520px,100%);background:#fff;border-radius:30px 30px 0 0;padding:20px 16px 25px;box-shadow:0 -18px 60px rgba(0,0,0,.18)}.handle{width:46px;height:5px;background:#dce2eb;border-radius:999px;margin:0 auto 16px}.sheet h3{margin:0 0 8px;font-size:1rem}.sheet p{color:var(--muted);font-size:.76rem;line-height:1.8}.otp{display:flex;justify-content:center;gap:10px;margin:16px 0}.otp input{width:52px;height:59px;border:2px solid var(--line);border-radius:17px;text-align:center;font-size:1.5rem;font-weight:900;outline:none}.otp input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(43,110,243,.1)}
.btn{border:0;border-radius:16px;min-height:48px;padding:0 15px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#2b6ef3,#6558f5);color:white}.btn.ghost{background:#eef3fb;color:#32435d}.btn.block{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.notice{padding:13px 14px;background:linear-gradient(135deg,#fff8e7,#fff4d6);border:1px solid #ffe2a4;border-radius:18px;font-size:.72rem;color:#76520e;line-height:1.8}.empty{padding:28px 18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.65);border-radius:22px;border:1px dashed #dbe2ec}.empty .big{font-size:28px;margin-bottom:8px}.back{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--primary);font-weight:900;padding:2px 0 12px}.list-gap{display:grid;gap:9px}.attendance-item{display:flex;align-items:center;gap:10px}.status{padding:5px 9px;border-radius:999px;font-size:.62rem;font-weight:900}.status.absent{background:#ffe8ed;color:#b51e48}.status.late{background:#fff2d7;color:#9b6100}.status.excused{background:#e9f8ef;color:#197347}.status.present{background:#edf7f2;color:#2b7d59}
@media (max-width:390px){.hero h2{font-size:1.28rem}.contact-grid{grid-template-columns:1fr}.stats{gap:6px}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="brand"><div class="brand-logo">س</div><div><h1>سامان</h1><p>ارتباط یکپارچه با مدرسه</p></div></div><button class="mini-btn" id="refreshBtn">↻</button></div>
  <div id="root"></div>
</div>
<div class="bottom hidden" id="bottomNav">
  <button class="nav active" data-page="home"><span class="ico">⌂</span>خانه</button>
  <button class="nav" data-page="chats"><span class="ico">◫</span>گفتگوها</button>
  <button class="nav" data-page="discipline"><span class="ico">✦</span>انضباط</button><button class="nav" data-page="notifications"><span class="ico">♢</span>اعلان‌ها</button>
  <button class="nav" data-page="contacts"><span class="ico">◎</span>ارتباط</button>
</div>
<script>
(() => {
'use strict';
const API='https://njinbgaatbnpuulnmoui.supabase.co/functions/v1/saman-gateway';
const STAFF_PORTAL_API='https://njinbgaatbnpuulnmoui.supabase.co/functions/v1/saman-staff-portal';
const SUPABASE_URL='https://njinbgaatbnpuulnmoui.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_G6aA1-On0kXDe_ZV4Wv79w_KLvAU1qK';
const staffAuth=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'saman-staff-password-auth'}});
const tg=window.Telegram?.WebApp || null;
try{tg?.ready();tg?.expand();}catch{}
const bale=window.Bale?.WebApp || null;
try{bale?.ready();bale?.expand();}catch{}
const params=new URLSearchParams(location.search);
let route=params.get('route')||'home', routeId=params.get('id')||'';
const staffMode=params.get('staff')==='1';
let state={me:null,conversations:[],notifications:[],unread:0,students:[],directory:[],studentId:'',chat:null,attendance:[],discipline:[],disciplineSummary:{positive:0,negative:0,balance:0},loading:true,error:'',platform:'',initReady:false,entryMode:null,staffSession:null};
const root=document.getElementById('root');
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function faNum(n){return String(n??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);}
function time(v){try{return new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return ''}}
function date(v){try{return new Intl.DateTimeFormat('fa-IR',{weekday:'short',day:'numeric',month:'long'}).format(new Date(v))}catch{return ''}}
function gregToJalali(v){try{const s=String(v||'').slice(0,10).split('-').map(Number);if(s.length!==3||s.some(Number.isNaN))return '';const f=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'UTC'});const parts=f.formatToParts(new Date(Date.UTC(s[0],s[1]-1,s[2]))),o={};parts.forEach(x=>{if(['year','month','day'].includes(x.type))o[x.type]=x.value});return `${o.year}/${o.month}/${o.day}`}catch{return String(v||'')}}
function getTodayJalali(){return gregToJalali(new Date().toISOString().slice(0,10))}
function initials(name){const a=String(name||'س').trim().split(/\s+/);return (a[0]?.[0]||'س')+(a[1]?.[0]||'')}
function channelInit(){ if(tg?.initData) return ['telegram',tg.initData]; const bi=bale?.initData||bale?.init_data||bale?.initDataRaw||''; if(bi) return ['bale',bi]; const ci=params.get('initData')||params.get('tgWebAppData')||params.get('baleWebAppData'); const cc=params.get('channel'); if(ci&&cc)return [String(cc).toLowerCase(),ci]; return ['', '']; }
async function api(action,payload={}){const [channel,initData]=channelInit();if(!channel||!initData){const e=new Error('AUTH_REQUIRED: Mini App باید از داخل Telegram یا Bale باز شود.');e.code='AUTH_REQUIRED';throw e;}const headers={'content-type':'application/json','x-channel':channel,'x-mini-init-data':initData};const r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,entry_mode:state.entryMode,...payload})});const p=await r.json().catch(()=>({ok:false,message:'پاسخ نامعتبر سرور'}));if(!r.ok||p.ok===false){const msg=String(p.message||'خطای سامانه');const e=new Error(msg);e.code=msg.split(':')[0];e.payload=p;throw e;}return p;}
function setNav(page){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function shell(content){return `<div>${content}</div>`}
function showEntryChoice(){
  state.entryMode=null;
  state.me=null;
  state.chat=null;
  document.getElementById('bottomNav')?.classList.add('hidden');
  root.innerHTML=`<section class="hero" style="margin-bottom:14px"><div class="eyebrow">سامان</div><h2>نوع ورود را انتخاب کنید</h2><p>برای اینکه پنل خانواده و پنل پرسنل کاملاً از هم جدا باشند، ابتدا مسیر ورود را مشخص کنید.</p></section>
  <div class="list-gap">
    <button class="card" style="width:100%;border:1px solid var(--line);text-align:right;cursor:pointer;padding:18px" onclick="chooseEntryMode('family')">
      <div class="conversation"><div class="avatar">👨‍👩‍👧</div><div class="grow"><strong style="font-size:.95rem">ورود اولیا</strong><div class="preview">مشاهده دانش‌آموزان، حضور و غیاب، انضباط، اعلان‌ها و گفتگو با مدرسه</div></div><span style="font-size:1.5rem">‹</span></div>
    </button>
    <button class="card" style="width:100%;border:1px solid var(--line);text-align:right;cursor:pointer;padding:18px" onclick="chooseEntryMode('staff')">
      <div class="conversation"><div class="avatar staff">🛡️</div><div class="grow"><strong style="font-size:.95rem">ورود پرسنل</strong><div class="preview">پنل اختصاصی مدیر، معاون، مشاور و نماینده کلاس بر اساس سطح دسترسی</div></div><span style="font-size:1.5rem">‹</span></div>
    </button>
  </div>
  <div class="notice" style="margin-top:12px">حسابی که هم‌زمان ولی و پرسنل مدرسه باشد، در هر ورود فقط پنلی را که انتخاب می‌کنید نمایش می‌دهد.</div>`;
}
window.showEntryChoice=showEntryChoice;
async function chooseEntryMode(mode){
  if(!['family','staff'].includes(mode))return;
  state.entryMode=mode;
  if(mode==='staff'){
    try{
      const {data:{session}}=await staffAuth.auth.getSession();
      if(session?.access_token){await loadStaffAll();return;}
    }catch{}
    renderStaffLogin();return;
  }
  document.getElementById('bottomNav')?.classList.remove('hidden');
  root.innerHTML='<div class="empty"><div class="big">⏳</div>در حال ورود به پنل خانواده...</div>';
  try{await loadAll()}catch(e){renderError(e)}
}
window.chooseEntryMode=chooseEntryMode;
function staffPortalApi(action,payload={}){
  return staffAuth.auth.getSession().then(({data:{session}})=>{
    if(!session?.access_token){const e=new Error('AUTH_REQUIRED');e.code='AUTH_REQUIRED';throw e;}
    state.staffSession=session;
    return fetch(STAFF_PORTAL_API,{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${session.access_token}`},body:JSON.stringify({action,...payload})})
      .then(async r=>{const p=await r.json().catch(()=>({ok:false,message:'پاسخ نامعتبر سرور'}));if(!r.ok||p.ok===false){const e=new Error(p.message||'خطای پنل پرسنل');e.code=String(p.message||'ERROR').split(':')[0];throw e;}return p;});
  });
}
function activeApi(action,payload={}){return state.entryMode==='staff'?staffPortalApi(action,payload):api(action,payload)}
function renderStaffLogin(message=''){
  document.getElementById('bottomNav')?.classList.add('hidden');
  root.innerHTML=`<button class="back" onclick="switchEntryMode()">← بازگشت</button><section class="hero"><div class="eyebrow">ورود پرسنل</div><h2>ورود با نام کاربری و رمز عبور</h2><p>مدیر، معاون، مشاور و نماینده کلاس با حساب پرسنلی خود وارد می‌شوند.</p></section><div class="card" style="margin-top:14px"><form id="staffLoginForm"><div class="form-group"><label>نام کاربری</label><input id="staffLoginUsername" dir="ltr" autocomplete="username" placeholder="مثلاً manager1" required></div><div class="form-group"><label>رمز عبور</label><input id="staffLoginPassword" type="password" autocomplete="current-password" required></div><div id="staffLoginMessage" class="notice ${message?'':'hidden'}" style="margin-bottom:10px">${escapeHtml(message)}</div><button class="btn primary block" id="staffLoginBtn" type="submit">🔐 ورود به پنل پرسنل</button></form></div><div class="notice" style="margin-top:10px">اگر این فرد هم‌زمان ولی یک یا چند دانش‌آموز باشد، حساب خانواده او جداگانه باقی می‌ماند و از گزینه «ورود اولیا» استفاده می‌شود.</div>`;
  $('staffLoginForm').onsubmit=submitStaffLogin;
  $('staffLoginUsername')?.focus();
}
async function submitStaffLogin(e){
  e.preventDefault();
  const username=String($('staffLoginUsername')?.value||'').trim().toLowerCase();
  const password=String($('staffLoginPassword')?.value||'');
  if(!username||!password)return;
  const btn=$('staffLoginBtn');if(btn)btn.disabled=true;
  try{
    const {data,error}=await staffAuth.auth.signInWithPassword({email:`${username}@staff.saman.local`,password});
    if(error)throw error;
    if(!data?.user)throw new Error('AUTH_INVALID');
    await loadStaffAll();
  }catch(err){renderStaffLogin('نام کاربری یا رمز عبور صحیح نیست.');console.error('staff login:',err);}
  finally{if($('staffLoginBtn'))$('staffLoginBtn').disabled=false}
}
async function loadStaffAll(){
  const p=await staffPortalApi('bootstrap');
  document.getElementById('bottomNav')?.classList.remove('hidden');
  state.me=p.me;state.conversations=p.conversations||[];state.notifications=p.notifications||[];state.unread=p.unread||0;state.students=p.me?.students||[];state.directory=[];
  applyCapabilities();renderPage();
}
async function staffLogout(){try{await staffAuth.auth.signOut()}catch{}state.me=null;state.conversations=[];state.notifications=[];state.students=[];state.chat=null;state.staffSession=null;showEntryChoice()}
window.staffLogout=staffLogout;

function switchEntryMode(){
  state.me=null;state.conversations=[];state.notifications=[];state.students=[];state.directory=[];state.chat=null;state.entryMode=null;
  showEntryChoice();
}
window.switchEntryMode=switchEntryMode;

function home(){setNav('home');const m=state.me||{};const isStaff=m.type==='staff';const unread=state.unread||0;return shell(`<section class="hero"><div class="hero-row"><div><div class="eyebrow">${isStaff?'پنل ارتباطی پرسنل':'درگاه خانواده'}</div><h2>${escapeHtml(m.name||'خوش آمدید')} 👋</h2><p>${isStaff?'مکالمات و اعلان‌های مربوط به محدوده دسترسی شما در یکجا قرار دارد.':'همه ارتباط‌های شما با مدرسه، یکجا و همیشه در دسترس.'}</p></div><div class="role-chip"><span class="online"></span>${escapeHtml(m.role_label||'خانواده')}</div></div></section>
<div class="stats"><div class="stat"><div class="n">${faNum(state.conversations.length)}</div><div class="l">گفتگو</div></div><div class="stat"><div class="n">${faNum(unread)}</div><div class="l">اعلان جدید</div></div><div class="stat"><div class="n">${faNum((state.students||[]).length)}</div><div class="l">دانش‌آموز</div></div></div>
${isStaff?staffHome():familyHome()}`)}
function familyHome(){return `${state.notifications.filter(x=>!x.read_at).slice(0,1).map(n=>`<div class="notice">${escapeHtml(n.rendered_body)}<br><button class="link" onclick="openNotification('${n.id}')">مشاهده اعلان ←</button></div>`).join('')}<div class="section-head"><h3>انضباط</h3><button class="link" onclick="openPage('discipline')">مشاهده</button></div><div class="card" style="cursor:pointer" onclick="openPage('discipline')"><div class="conversation"><div class="avatar" style="background:#ecfdf3;color:#087443">✦</div><div class="grow"><strong>سوابق انضباطی</strong><div class="preview">نمره‌های مثبت و منفی دانش‌آموزان را ببینید.</div></div><span>›</span></div></div>

async function openNotification(id){
  const n=state.notifications.find(x=>String(x.id)===String(id));
  if(!n)return;
  try{
    await activeApi('mark_notification_read',{id});
    state.notifications=state.notifications.map(x=>String(x.id)===String(id)?{...x,read_at:new Date().toISOString(),status:'read'}:x);
    state.unread=state.notifications.filter(x=>!x.read_at).length;
    if(n.route==='conversation' && n.route_id){ await openChat(String(n.route_id)); return; }
    if(n.route==='attendance' && n.student_id && state.me?.type==='family'){ await loadAttendance(String(n.student_id)); return; }
    if(n.route==='discipline' && n.student_id){ await loadDiscipline(String(n.student_id)); return; }
    renderPage();
  }catch(e){alert(e.message||'باز کردن اعلان انجام نشد.')}
}

    state.me=p.me;state.conversations=p.conversations||[];state.notifications=p.notifications||[];state.unread=p.unread||0;state.students=p.me?.students||[];
    if(p.me?.type==='family'){try{const d=await activeApi('directory');state.directory=d.items||[]}catch{state.directory=[]}}else state.directory=[];
    applyCapabilities();renderPage();
    if(routeId){const rid=routeId;routeId='';if(route==='conversation')openChat(rid).catch(()=>{});else if(route==='attendance'&&state.me?.type==='family')loadAttendance(rid).catch(()=>{});else if(route==='discipline')loadDiscipline(rid||'').catch(()=>{});else if(route==='notifications')openPage('notifications');}
  }catch(e){state.error=e.code||e.message;renderError(e)}finally{state.loading=false}
}
function renderError(e){const auth=e.code==='AUTH_REQUIRED'||String(e.message||'').startsWith('AUTH_REQUIRED');root.innerHTML=`<div class="empty"><div class="big">⚠️</div><strong>${auth?'هویت Mini App دریافت نشد':(e.code==='MINI_APP_CONTEXT_MISSING'?'سامان باید از داخل ربات باز شود':'اتصال به سامان برقرار نشد')}</strong><p style="font-size:.72rem;line-height:1.9">${auth?'این صفحه باید از دکمه Mini App داخل ربات Telegram یا Bale باز شود. اگر داخل پیام‌رسان هستید، Mini App را یک‌بار ببندید و دوباره باز کنید.':(e.code==='MINI_APP_CONTEXT_MISSING'?'این صفحه را مستقیماً در مرورگر باز نکنید. از دکمه «ورود به سامان» داخل Telegram یا Bale وارد شوید.':'خطا: '+escapeHtml(e.message||'خطای ناشناخته'))}</p><button class="btn primary" style="margin-top:12px" onclick="loadAll()">تلاش دوباره</button></div>`}
$('refreshBtn').onclick=loadAll;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
window.renderAttendanceList=renderAttendanceList;window.loadAttendance=loadAttendance;
if(staffMode)chooseEntryMode('staff');else showEntryChoice();setInterval(()=>{if(!document.hidden&&state.entryMode)loadAll().catch(()=>{})},12000);
})();
</script>
</body>
</html>

<html lang="fa" dir="rtl">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 20px;
      direction: rtl;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .hidden { display: none !important; }
    .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .flex-between { justify-content: space-between; }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
    }
    .card .number { font-size: 2rem; font-weight: 700; color: #1a73e8; }
    .card .label { font-size: 0.9rem; color: #666; margin-top: 6px; }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      background: #e0e0e0;
      color: #333;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-danger { background: #d32f2f; color: #fff; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-warning { background: #f9a825; color: #000; }
    .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; color: #444; }
    tr:hover { background: #f1f5f9; }
    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-danger { background: #f8d7da; color: #721c24; }
    .badge-warning { background: #fff3cd; color: #856404; }
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .pagination .active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 150px; }
    .text-center { text-align: center; }
    .mt-20 { margin-top: 20px; }
    .mb-20 { margin-bottom: 20px; }

    /* ===== Datepicker شمسی دست‌ساز ===== */
    .datepicker-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    .datepicker-wrapper input {
      width: 100%;
      cursor: pointer;
      background-color: #fff;
    }
    .datepicker-popup {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 9999;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      min-width: 250px;
      display: none;
      font-size: 0.9rem;
    }
    .datepicker-popup.show {
      display: block;
    }
    .datepicker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .datepicker-header button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 8px;
      color: #1a73e8;
    }
    .datepicker-header .month-year {
      font-weight: 600;
      font-size: 1rem;
    }
    .datepicker-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: #666;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }
    .datepicker-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .datepicker-days button {
      background: none;
      border: none;
      padding: 6px 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;

    }
    .datepicker-days button.selected {

      color: #fff;
    }
    .datepicker-days button.other-month {

    }
    .datepicker-days button.today {
      font-weight: 700;
      border: 1px solid #1a73e8;
    }

    @media (max-width: 700px) {

      table { font-size: 0.8rem; }

      .datepicker-popup { min-width: 200px; }
    }
    @media (max-width: 500px) {
      .grid-cards { grid-template-columns: 1fr; }
    }
  </style>

<script>
  // ============================================================
  // 1. اتصال به Supabase
  // ============================================================
  const SUPABASE_URL = 'https://njinbgaatbnpuulnmoui.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_G6aA1-On0kXDe_ZV4Wv79w_KLvAU1qK';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  // 2. متغیرهای عمومی
  // ============================================================
  let currentUser = null;
  let currentTab = 'dashboard';
  let selectedStudentIds = new Set();
  let currentStudentPage = 1;
  const PAGE_SIZE = 50;
  let studentFilters = { search: '', grade: '', major: '', classId: '', active: 'true' };

  // ============================================================
  // 3. توابع تبدیل تاریخ شمسی (دقیق و بدون خطا)
  // ============================================================
  // آرایه‌های کمکی برای تبدیل شمسی به میلادی
  const jalaaliMonths = [0, 31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
  const gregorianMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

  function isLeapJalali(year) {
    // الگوریتم کبیسه‌گیری شمسی
    const y = year % 33;
    return y === 1 || y === 5 || y === 9 || y === 13 || y === 17 || y === 22 || y === 26 || y === 30;
  }

  function isLeapGregorian(year) {
    return (year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0);
  }

  function jalaliToGregorian(jy, jm, jd) {
    // تبدیل تاریخ شمسی به میلادی با الگوریتم دقیق
    let jy2 = jy - 979;
    let jm2 = jm - 1;
    let jd2 = jd - 1;

    let gDayNo = 365 * jy2 + Math.floor(jy2 / 33) * 8 + Math.floor((jy2 % 33 + 3) / 4);
    for (let i = 0; i < jm2; i++) {
      gDayNo += jalaaliMonths[i];
    }
    gDayNo += jd2;

    let gYear = 0;
    let gDayNo2 = gDayNo + 79;
    let gYear2 = gDayNo2 * 400 / 146097;
    gYear2 = Math.floor(gYear2);
    let gDayNo3 = gDayNo2 - Math.floor(gYear2 * 146097 / 400) + 1;

    let gMonth = 0;
    let gDay = 0;
    for (let i = 0; i < 12; i++) {
      let daysInMonth = gregorianMonths[i + 1];
      if (i === 1 && isLeapGregorian(gYear2 + 1)) daysInMonth = 29;
      if (gDayNo3 <= daysInMonth) {
        gMonth = i + 1;
        gDay = gDayNo3;
        break;
      }
      gDayNo3 -= daysInMonth;
    }
    gYear = gYear2 + 1;
    return { year: gYear, month: gMonth, day: gDay };
  }

  function gregorianToJalali(gy, gm, gd) {
    // تبدیل میلادی به شمسی
    let gDayNo = 0;
    for (let i = 1; i < gm; i++) {
      gDayNo += gregorianMonths[i];
      if (i === 2 && isLeapGregorian(gy)) gDayNo++;
    }
    gDayNo += gd;

    let jy = gy - 621;
    let jDayNo = gDayNo + 79;
    let jy2 = jy - 1;
    let jDayNo2 = jDayNo + 365 * jy2 + Math.floor(jy2 / 33) * 8 + Math.floor((jy2 % 33 + 3) / 4) + 1;
    let jm = 0;
    let jd = 0;
    for (let i = 0; i < 12; i++) {
      let daysInMonth = jalaaliMonths[i + 1];
      if (i === 11 && isLeapJalali(jy)) daysInMonth = 30;
      if (jDayNo2 <= daysInMonth) {
        jm = i + 1;
        jd = jDayNo2;
        break;
      }
      jDayNo2 -= daysInMonth;
    }
    return { year: jy, month: jm, day: jd };
  }

  function toJalaali(dateStr) {
    if (!dateStr) return '';
    try {
      const parts = dateStr.split('-');
      if (parts.length !== 3) return '';
      const gy = parseInt(parts[0]);
      const gm = parseInt(parts[1]);
      const gd = parseInt(parts[2]);
      if (isNaN(gy) || isNaN(gm) || isNaN(gd)) return '';
      const j = gregorianToJalali(gy, gm, gd);
      return `${j.year}/${String(j.month).padStart(2,'0')}/${String(j.day).padStart(2,'0')}`;
    } catch (e) { return ''; }
  }

  function toGregorian(jDate) {
    if (!jDate) return '';
    try {
      const parts = jDate.split('/');
      if (parts.length !== 3) return '';
      const jy = parseInt(parts[0]);
      const jm = parseInt(parts[1]);
      const jd = parseInt(parts[2]);
      if (isNaN(jy) || isNaN(jm) || isNaN(jd)) return '';
      const g = jalaliToGregorian(jy, jm, jd);
      return `${g.year}-${String(g.month).padStart(2,'0')}-${String(g.day).padStart(2,'0')}`;
    } catch (e) { return ''; }
  }

  function getTodayGregorian() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getTodayJalali() {
    return toJalaali(getTodayGregorian());
  }

  // ============================================================
  // 4. Datepicker شمسی دست‌ساز
  // ============================================================
  class JalaliDatepicker {
    constructor(inputElement) {
      this.input = inputElement;
      this.popup = null;
      this.currentYear = null;
      this.currentMonth = null;
      this.selectedDate = null;
      this.isOpen = false;

      // ایجاد popup
      this.createPopup();

      // رویدادها
      this.input.addEventListener('click', () => this.toggle());
      this.input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') this.close();
      });

      // مقداردهی اولیه با تاریخ امروز
      const today = getTodayJalali();
      const parts = today.split('/');
      if (parts.length === 3) {
        this.currentYear = parseInt(parts[0]);
        this.currentMonth = parseInt(parts[1]);
        this.selectedDate = today;
        this.input.value = today;
      }

      // بستن با کلیک خارج
      document.addEventListener('click', (e) => {
        if (!this.input.closest('.datepicker-wrapper')?.contains(e.target) &&
            !this.popup.contains(e.target)) {
          this.close();
        }
      });
    }

    createPopup() {
      this.popup = document.createElement('div');
      this.popup.className = 'datepicker-popup';
      this.popup.innerHTML = `
        <div class="datepicker-header">
          <button class="prev-month"><i class="fas fa-chevron-right"></i></button>
          <span class="month-year"></span>
          <button class="next-month"><i class="fas fa-chevron-left"></i></button>
        </div>
        <div class="datepicker-weekdays">
          <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
        </div>
        <div class="datepicker-days"></div>
      `;
      this.input.parentNode.appendChild(this.popup);

      // رویدادهای popup
      this.popup.querySelector('.prev-month').addEventListener('click', (e) => {
        e.stopPropagation();
        this.changeMonth(-1);
      });
      this.popup.querySelector('.next-month').addEventListener('click', (e) => {
        e.stopPropagation();
        this.changeMonth(1);
      });
    }

    toggle() {
      if (this.isOpen) {
        this.close();
      } else {
        this.open();
      }
    }

    open() {
      if (!this.currentYear || !this.currentMonth) {
        const today = getTodayJalali().split('/');
        if (today.length === 3) {
          this.currentYear = parseInt(today[0]);
          this.currentMonth = parseInt(today[1]);
        }
      }
      this.render();
      this.popup.classList.add('show');
      this.isOpen = true;
    }

    close() {
      this.popup.classList.remove('show');
      this.isOpen = false;
    }

    changeMonth(delta) {
      let newMonth = this.currentMonth + delta;
      let newYear = this.currentYear;
      if (newMonth > 12) {
        newMonth = 1;
        newYear++;
      } else if (newMonth < 1) {
        newMonth = 12;
        newYear--;
      }
      this.currentYear = newYear;
      this.currentMonth = newMonth;
      this.render();
    }

    render() {
      const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
      const header = this.popup.querySelector('.month-year');
      header.textContent = `${monthNames[this.currentMonth - 1]} ${this.currentYear}`;

      const daysContainer = this.popup.querySelector('.datepicker-days');
      daysContainer.innerHTML = '';

      // تعیین روز اول ماه
      const firstDayDate = jalaliToGregorian(this.currentYear, this.currentMonth, 1);
      const firstDayGreg = new Date(firstDayDate.year, firstDayDate.month - 1, firstDayDate.day);
      let startDayOfWeek = firstDayGreg.getDay(); // 0=شنبه در ایران (یکشنبه بین‌المللی)
      // در تقویم شمسی، شنبه = 0
      // اما getDay() یکشنبه = 1، دوشنبه = 2، ...، شنبه = 6 (در جاوااسکریپت یکشنبه = 1)
      // پس باید اصلاح کنیم: روزها به ترتیب شنبه(0) تا جمعه(6)
      // getDay() returns 0=یکشنبه, 1=دوشنبه, 2=سه‌شنبه, 3=چهارشنبه, 4=پنج‌شنبه, 5=جمعه, 6=شنبه
      // بنابراین شنبه = 6، یکشنبه = 0
      let startOffset = (startDayOfWeek + 1) % 7; // برای تبدیل به شنبه‌محور

      const daysInMonth = jalaaliMonths[this.currentMonth];
      const totalDays = (this.currentMonth === 12 && isLeapJalali(this.currentYear)) ? 30 : daysInMonth;

      // روزهای ماه قبل
      const prevMonth = this.currentMonth === 1 ? 12 : this.currentMonth - 1;
      const prevYear = this.currentMonth === 1 ? this.currentYear - 1 : this.currentYear;
      const daysInPrevMonth = (prevMonth === 12 && isLeapJalali(prevYear)) ? 30 : jalaaliMonths[prevMonth];
      const prevMonthDays = daysInPrevMonth - startOffset + 1;

      for (let i = 0; i < startOffset; i++) {
        const day = prevMonthDays + i;
        const btn = document.createElement('button');
        btn.textContent = day;
        btn.className = 'other-month';
        btn.addEventListener('click', () => {
          const newDate = `${prevYear}/${String(prevMonth).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
          this.selectDate(newDate);
        });
        daysContainer.appendChild(btn);
      }

      // روزهای ماه جاری
      const todayJalali = getTodayJalali();
      for (let d = 1; d <= totalDays; d++) {
        const btn = document.createElement('button');
        btn.textContent = d;
        const dateStr = `${this.currentYear}/${String(this.currentMonth).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
        if (dateStr === this.selectedDate) {
          btn.classList.add('selected');
        }
        if (dateStr === todayJalali) {
          btn.classList.add('today');
        }
        btn.addEventListener('click', () => {
          this.selectDate(dateStr);
        });
        daysContainer.appendChild(btn);
      }

      // روزهای ماه بعد
      const totalCells = startOffset + totalDays;
      const remainingCells = 42 - totalCells;
      const nextMonth = this.currentMonth === 12 ? 1 : this.currentMonth + 1;
      const nextYear = this.currentMonth === 12 ? this.currentYear + 1 : this.currentYear;
      for (let d = 1; d <= remainingCells; d++) {
        const btn = document.createElement('button');
        btn.textContent = d;
        btn.className = 'other-month';
        btn.addEventListener('click', () => {
          const newDate = `${nextYear}/${String(nextMonth).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
          this.selectDate(newDate);
        });
        daysContainer.appendChild(btn);
      }
    }

    selectDate(dateStr) {
      this.selectedDate = dateStr;
      this.input.value = dateStr;
      this.close();
      // trigger change event
      this.input.dispatchEvent(new Event('change'));
    }

    getValue() {
      return this.input.value;
    }

    setDate(dateStr) {
      this.selectedDate = dateStr;
      this.input.value = dateStr;
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        this.currentYear = parseInt(parts[0]);
        this.currentMonth = parseInt(parts[1]);
      }
    }
  }

  function toast(msg, type = 'success') {
    Swal.fire({ text: msg, icon: type, timer: 3000, showConfirmButton: false });
  }

  function showModal(html) {
    return new Promise((resolve) => {
      Swal.fire({
        html: html,
        showCancelButton: true,
        confirmButtonText: 'تأیید',
        cancelButtonText: 'لغو',
        preConfirm: () => {
          const form = document.getElementById('modalForm');
          if (form) {
            const data = new FormData(form);
            return Object.fromEntries(data.entries());
          }
          return {};
        }
      }).then(result => {
        if (result.isConfirmed) resolve(result.value);
        else resolve(null);
      });
    });
  }

  function renderPagination(total, page, limit, containerId, onPageChange) {
    const totalPages = Math.ceil(total / limit);
    const el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = parseInt(btn.dataset.page);
        onPageChange(p);
      });
    });
  }

  async function loadStudents(page = 1) {
    currentStudentPage = page;
    const { search, grade, major, classId, active } = studentFilters;
    let query = supabaseClient.from('students').select(`
      id, first_name, last_name, grade, major, class_id, internal_code, active,
      classes(name)
    `, { count: 'exact' });

    if (search) query = query.or(`first_name.ilike.%${search}%,last_name.ilike.%${search}%,internal_code.ilike.%${search}%`);
    if (grade) query = query.eq('grade', grade);
    if (major) query = query.eq('major', major);
    if (classId) query = query.eq('class_id', classId);
    if (active !== 'all') query = query.eq('active', active === 'true');

    const from = (page - 1) * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;
    query = query.range(from, to).order('id', { ascending: false });

    const { data, error, count } = await query;
    if (error) return toast(error.message, 'error');

    let html = `<table><tr><th><input type="checkbox" id="selectAllStudents" /></th>
      <th>نام</th><th>نام خانوادگی</th><th>پایه</th><th>رشته</th><th>کلاس</th><th>وضعیت</th><th>عملیات</th></tr>`;
    data.forEach(s => {
      const checked = selectedStudentIds.has(s.id) ? 'checked' : '';
      html += `<tr>
        <td><input type="checkbox" class="student-checkbox" data-id="${s.id}" ${checked} /></td>
        <td>${s.first_name}</td><td>${s.last_name}</td><td>${s.grade}</td><td>${s.major || '-'}</td>
        <td>${s.classes?.name || '-'}</td>
        <td><span class="badge ${s.active ? 'badge-success' : 'badge-danger'}">${s.active ? 'فعال' : 'غیرفعال'}</span></td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="editStudent('${s.id}')">ویرایش</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">حذف</button>
        </td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('studentsTableContainer').innerHTML = html;

    document.getElementById('selectAllStudents')?.addEventListener('change', (e) => {
      document.querySelectorAll('.student-checkbox').forEach(cb => {
        cb.checked = e.target.checked;
        if (e.target.checked) selectedStudentIds.add(cb.dataset.id);
        else selectedStudentIds.delete(cb.dataset.id);
      });
      updateBulkButtons();
    });

    document.querySelectorAll('.student-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = cb.dataset.id;
        if (cb.checked) selectedStudentIds.add(id);
        else selectedStudentIds.delete(id);
        updateBulkButtons();
      });
    });

    renderPagination(count, page, PAGE_SIZE, 'studentsPagination', (p) => loadStudents(p));
    updateBulkButtons();
    populateFilterSelects();
  }

    document.getElementById('bulkDeleteBtn').disabled = count === 0;

  // ============================================================
  // 18. ورود از اکسل (بهینه و بدون خطای تکراری)
  // ============================================================
  let excelData = [];
  let excelHeaders = [];
  let columnMap = {};

  document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const data = new Uint8Array(ev.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (json.length) {
        excelHeaders = json[0].map(String);
        excelData = json.slice(1);
        showExcelPreview();
        document.getElementById('importExcelBtn').disabled = false;
      }
    };
    reader.readAsArrayBuffer(file);
  });

  function showExcelPreview() {
    let html = `<h4>پیش‌نمایش (۱۰ ردیف اول)</h4>
      <div style="overflow-x:auto;"><table><tr>${excelHeaders.map(h => `<th>${h}</th>`).join('')}</tr>`;
    const previewRows = excelData.slice(0, 10);
    previewRows.forEach(row => {
      html += `<tr>${row.map(cell => `<td>${cell || ''}</td>`).join('')}</tr>`;
    });
    html += '</table></div>';

    html += `<h4>نگاشت ستون‌ها</h4><div class="form-row">`;
    const fields = ['first_name', 'last_name', 'grade', 'major', 'class_name', 'internal_code'];
    const labels = {
      first_name: 'نام',
      last_name: 'نام خانوادگی',
      grade: 'پایه',
      major: 'رشته',
      class_name: 'نام کلاس',
      internal_code: 'کد داخلی'
    };
    fields.forEach(f => {
      html += `<div class="form-group"><label>${labels[f]}</label>
        <select data-field="${f}" class="col-map">
          <option value="">انتخاب نشود</option>
          ${excelHeaders.map((h, idx) => `<option value="${idx}">${h}</option>`).join('')}
        </select></div>`;
    });
    html += '</div>';
    document.getElementById('excelPreview').innerHTML = html;

    document.querySelectorAll('.col-map').forEach(sel => {
      sel.addEventListener('change', () => {
        const field = sel.dataset.field;
        const idx = parseInt(sel.value);
        if (!isNaN(idx)) columnMap[field] = idx;
        else delete columnMap[field];
      });
    });
  }

  document.getElementById('importExcelBtn').addEventListener('click', async () => {
    if (Object.keys(columnMap).length === 0) return toast('حداقل یک ستون را نگاشت کنید', 'error');

    const rawStudents = [];
    const errors = [];
    const internalCodes = new Set();

    for (let i = 0; i < excelData.length; i++) {
      try {
        const row = excelData[i];
        const student = {};
        for (const [field, idx] of Object.entries(columnMap)) {
          student[field] = row[idx]?.toString().trim() || '';
        }
        if (!student.first_name || !student.last_name) {
          errors.push(`ردیف ${i+2}: نام یا نام خانوادگی خالی`);
          continue;
        }
        if (student.internal_code) {
          if (internalCodes.has(student.internal_code)) {
            errors.push(`ردیف ${i+2}: کد داخلی تکراری در فایل`);
            continue;
          }
          internalCodes.add(student.internal_code);
        }
        rawStudents.push({ ...student, rowIndex: i });
      } catch (err) {
        errors.push(`ردیف ${i+2}: خطا - ${err.message}`);
      }
    }

    if (rawStudents.length === 0) {
      return toast('هیچ دانش‌آموز معتبری یافت نشد', 'error');
    }

    const codeList = rawStudents.map(s => s.internal_code).filter(c => c);
    let existingCodesSet = new Set();
    if (codeList.length > 0) {
      const { data: existing } = await supabaseClient
        .from('students')
        .select('internal_code')
        .in('internal_code', codeList);
      if (existing) {
        existing.forEach(e => existingCodesSet.add(e.internal_code));
      }
    }

    const validStudents = rawStudents.filter(s => {
      if (s.internal_code && existingCodesSet.has(s.internal_code)) {
        errors.push(`ردیف ${s.rowIndex+2}: کد داخلی قبلاً ثبت شده است`);
        return false;
      }
      return true;
    });

    if (validStudents.length === 0) {
      return toast('هیچ دانش‌آموز جدیدی برای ثبت وجود ندارد', 'warning');
    }

    const classNames = validStudents.map(s => s.class_name).filter(c => c);
    const uniqueClassNames = [...new Set(classNames)];
    const classMap = {};

    for (const className of uniqueClassNames) {
      let query = supabaseClient.from('classes').select('id, grade, major')
        .eq('name', className);
      const sample = validStudents.find(s => s.class_name === className);
      if (sample?.grade) query = query.eq('grade', sample.grade);
      if (sample?.major) query = query.eq('major', sample.major);
      const { data: existing } = await query.maybeSingle();
      if (existing) {
        classMap[className] = existing.id;
      } else {
        const newClass = {
          name: className,
          grade: sample?.grade || 'نامشخص',
          major: sample?.major || null,
          active: true
        };
        const { data: inserted, error } = await supabaseClient
          .from('classes')
          .insert(newClass)
          .select('id')
          .single();
        if (error) {
          errors.push(`خطا در ایجاد کلاس ${className}: ${error.message}`);
          continue;
        }
        classMap[className] = inserted.id;
      }
    }

    const studentsToInsert = validStudents.map(s => ({
      first_name: s.first_name,
      last_name: s.last_name,
      grade: s.grade || 'نامشخص',
      major: s.major || null,
      class_id: s.class_name ? classMap[s.class_name] : null,
      internal_code: s.internal_code || null,
      active: true
    }));

    const BATCH_SIZE = 100;
    let insertedCount = 0;
    for (let i = 0; i < studentsToInsert.length; i += BATCH_SIZE) {
      const batch = studentsToInsert.slice(i, i + BATCH_SIZE);
      const { error } = await supabaseClient
        .from('students')
        .upsert(batch, { onConflict: 'internal_code' });
      if (error) {
        for (const student of batch) {
          const { error: singleError } = await supabaseClient
            .from('students')
            .insert(student);
          if (singleError && singleError.code !== '23505') {
            errors.push(`خطا در ثبت ${student.first_name} ${student.last_name}: ${singleError.message}`);
          } else if (!singleError) {
            insertedCount++;
          }
        }
      } else {
        insertedCount += batch.length;
      }
    }

    toast(`${insertedCount} دانش‌آموز با موفقیت ثبت شدند. تعداد خطا: ${errors.length}`);
    document.getElementById('importResult').innerHTML = `
      <p>کل ردیف‌ها: ${excelData.length}</p>
      <p>ثبت شده: ${insertedCount}</p>
      <p>خطا: ${errors.length}</p>
      <pre style="max-height:200px; overflow-y:auto;">${errors.join('\n')}</pre>
    `;
  });

  function resetImport() {
    document.getElementById('excelFile').value = '';
    document.getElementById('excelPreview').innerHTML = '';
    document.getElementById('importResult').innerHTML = '';
    document.getElementById('importExcelBtn').disabled = true;
    excelData = [];
    excelHeaders = [];
    columnMap = {};
  }

  // ============================================================
  // 19. بارگذاری اولیه
  // ============================================================
  async function loadAllSelects() {
    await populateFilterSelects();
    await loadReportSelects();
    await loadBellsForAttendance();
  }

  // ============================================================
  // 20. بررسی وضعیت ورود
  // ============================================================
  (async function init() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (user) {
      currentUser = user;
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('mainPage').classList.remove('hidden');
      document.getElementById('userDisplay').textContent = `خوش آمدید ${user.email}`;
      loadDashboard();
      loadAllSelects();
      showTab('dashboard');
      setTimeout(initDatepickers, 500);
    }
  })();
</script>
</body>
